name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mojo:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      # sigv4.mojo and xml.mojo are consumed by source path
      # (`-I ../sigv4.mojo/src`), so CI lays them out next to this checkout.
      - uses: actions/checkout@v4
        with:
          path: maws
      - uses: actions/checkout@v4
        with:
          repository: magmalake/sigv4.mojo
          path: sigv4.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/xml.mojo
          path: xml.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.79.0
          manifest-path: maws/pixi.toml
          environments: ${{ matrix.env }}
          locked: false

      - name: Unit tests and build
        working-directory: maws
        run: pixi run -e ${{ matrix.env }} check

      - name: CLI smoke
        working-directory: maws
        run: pixi run -e ${{ matrix.env }} ./build/maws --version

      # The release tarball, built and run *outside* pixi, so a binary that
      # still needs the environment fails here rather than for a user.
      - name: Release tarball
        if: matrix.env == 'stable'
        working-directory: maws
        run: |
          pixi run -e stable dist
          mkdir -p "$RUNNER_TEMP/unpack"
          tar -C "$RUNNER_TEMP/unpack" -xzf build/dist/maws-*.tar.gz
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$RUNNER_TEMP"/unpack/maws-*/bin/maws --version

      # install.sh against that tarball, served the way a release serves it.
      - name: Install script
        if: matrix.env == 'stable'
        working-directory: maws
        run: |
          v="$(sed -n 's/^comptime VERSION = "\(.*\)"/\1/p' src/main.mojo)"
          mkdir -p "$RUNNER_TEMP/srv/v$v"
          cp build/dist/maws-*.tar.gz build/dist/maws-*.tar.gz.sha256 "$RUNNER_TEMP/srv/v$v/"
          (cd "$RUNNER_TEMP/srv" && python3 -m http.server 18766 --bind 127.0.0.1 &)
          sleep 2
          MAWS_RELEASE_BASE=http://127.0.0.1:18766 MAWS_VERSION="$v" \
            MAWS_HOME="$RUNNER_TEMP/maws-home" MAWS_BIN_DIR="$RUNNER_TEMP/maws-bin" \
            bash install.sh
          "$RUNNER_TEMP/maws-bin/maws" --version

      - uses: actions/upload-artifact@v4
        if: matrix.env == 'stable'
        with:
          name: maws-${{ matrix.os }}
          path: maws/build/dist/*.tar.gz*

  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project py_reference pytest -q py_reference/tests
